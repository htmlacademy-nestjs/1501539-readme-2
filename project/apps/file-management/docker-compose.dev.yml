services:
  readme.file-management.mongo:
    image: mongo:4.4
    restart: always
    container_name: readme.file-management.mongo

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 123456
      MONGO_INITDB_DATABASE: readme-file-management

    ports:
      - 27018:27017

    volumes:
      - readme.mongo.file-management:/data/db

    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/readme-file-management --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  readme.file-management.mongo.ui:
    image: mongo-express
    restart: always
    container_name: readme.file-management.mongo.ui
    ports:
      - 8083:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: 123456
      ME_CONFIG_MONGODB_URL: mongodb://admin:123456@readme.file-management.mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: 123456

volumes:
  readme.mongo.file-management:
